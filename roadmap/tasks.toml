# Phase 7 — Native-Elixir Migration ───────────────────────────────────────

[[task]]
id = "N0"
phase = 7
bundle = "native"
status = "pending"
title = "`defendpoint` macro + CCXT-JS source extractor"
scores = { d = 7, b = 9, u = 8 }
scored_at = "2026-05-16"
body = """
*The leverage that makes the rest of Phase 7 tractable.* Two parts:

(1) **Macro:** `defendpoint :fetch_ticker, "GET /api/v3/ticker/24hr", params: [symbol: :string], returns: Ticker.t(), parse: &parse_ticker/1` emits the Req call, signing dispatch (for private endpoints), response parser invocation, struct hydration into the Phase 2 typed structs, and error normalization. NimbleOptions schema validates the option keyword. The output of one declaration is a complete behaviour-callback implementation.

  **Signing as a declarative option, not a hand-written `sign/1` per venue.** Auth shapes vary across exchanges (HMAC-SHA256 over query, HMAC over body, HMAC over canonical-string, JWT bearer, Ed25519, web3 personal_sign) but the *shape* is declarative: which fields go into the canonical string, where the signature attaches (header / query / body), where the timestamp goes, the nonce strategy. The `:signed` option on `defendpoint` carries that shape — e.g. `signed: [scheme: :hmac_sha256, sign: :query, params: [:timestamp, :recv_window], header: "X-MBX-SIGNATURE"]`. Across N4–N7 that collapses ~30 LOC × 5 venues of repetitive sign-then-attach-header code into one declaration per private endpoint. Precedent: Joken's `Joken.Config` declarative signer config. NimbleOptions schema validates each scheme's required fields; exotic schemes drop to `signed: {:custom, &MyExchange.sign/2}` as an escape hatch. The extractor in (2) emits the right `:signed` option from CCXT's per-exchange `sign()` fn rather than copying its body.

(2) **Extractor:** at compile time, parse `node_modules/ccxt/js/src/<exchange>.js` via OXC to emit the per-exchange `defendpoint` table automatically. CCXT REST adapters are mostly URL templates + parameter maps + a `sign()` fn + per-method `parseX()` fns — all extractable. Output is committed to `priv/native_adapters/<exchange>.exs` so codegen is reproducible without running OXC at compile time. Hand-fixes for genuinely venue-specific quirks layered on top via override hooks.

Without N0, every exchange in N4–N7 reimplements the same boilerplate. With N0, per-exchange porting becomes "extract → review → patch the hard 20%."
"""

