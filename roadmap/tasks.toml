[[task]]
id = "N3"
phase = 7
bundle = "native"
status = "pending"
title = "Conformance harness"
scores = { d = 6, b = 9, u = 9 }
scored_at = "2026-05-16"
depends_on = ["N1", "N2", "T4"]
body = """
*The leverage point — and a hard gate on N4–N7.* For any `(exchange, method)`, run the JS path *and* the native path against the same input in parallel; assert struct equality after normalization. Plus T4's byte-equal signing comparison for private methods. Before any method flips to `:native` in production, conformance must agree across N runs on testnet *and* mainnet read-only. ExUnit + property-based generators for the input space. Land N3 *before* N4 — without it, "the native port works" is unfalsifiable.

**Declarative pair specs via `defconformance`.** Each `(exchange, method)` pair needs sample args, ignored fields (timestamps, request IDs, latency-dependent diffs), and per-field tolerance (decimal rounding, list ordering when the spec doesn't pin it). Hand-rolling that as ~10 methods × 5 venues = 50 test bodies recreates the boilerplate Phase 2's macros exist to kill. Instead: `defconformance :fetch_ticker, exchange: :binance, args: [symbol: "BTC/USDT"], ignore: [:timestamp, :info], tolerance: %{vwap: 0.0001}` generates the parallel-call test, the normalization step, the struct diff, and the property-based input generator from the param schema in N0. NimbleOptions schema validates the declaration; the macro expands into a standard ExUnit `test` block so failures point at the declaration site. Bypass via a hand-written `test` when a pair needs genuinely bespoke setup (e.g. websocket warm-up before the JS path is queryable).
"""

