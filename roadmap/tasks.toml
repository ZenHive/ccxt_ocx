[[task]]
id = "3"
phase = 1
bundle = "foundation"
status = "done"
title = "`CcxtOcx.RuntimePool` supervisor"
scores = { d = 5, b = 8, u = 7 }
scored_at = "2026-05-16"
body = """
Build the supervised runtime pooling layer from observed QuickBEAM behavior, not assumption. Tidewave confirmed `QuickBEAM.Pool.run/3` resets and re-runs `:init` after each checkout; because the CCXT browser bundle is ~5.4 MB, first benchmark whether that reset cost is acceptable for ccxt workloads. If it is acceptable, wrap `QuickBEAM.Pool` behind `CcxtOcx.RuntimePool`. If it is not, implement a long-lived pool of `CcxtOcx.Runtime` workers that keeps CCXT loaded across calls. The public pool API should hide which strategy is chosen and should support sizing per `(exchange, market_type)`.
"""
acceptance_criteria = [
  "Benchmark or integration test demonstrates whether a checkout re-evaluates the CCXT bundle for the chosen strategy",
  "Pool is supervised under the application and can execute concurrent CCXT eval/call work",
  "Each checked-out runtime has CCXT loaded and reports the same bundle version/exchange count as `CcxtOcx.Runtime.info/1`",
  "Tests cover worker crash/restart behavior and concurrent checkout behavior"
]
implemented = "Long-lived pool strategy chosen after benchmarking confirmed `QuickBEAM.Pool.run/3` reset cost was unacceptable (~5.4MB CCXT bundle re-eval per checkout). `CcxtOcx.RuntimePool` keeps CCXT loaded across calls, supervised under the application, sizable per `(exchange, market_type)`. Worker crash/restart and concurrent-checkout behavior covered by tests."

[[task]]
id = "4"
phase = 1
bundle = "foundation"
status = "done"
title = "`CcxtOcx.Error` — canonical error taxonomy + JS adapter mapping"
scores = { d = 4, b = 7, u = 6 }
scored_at = "2026-05-16"
body = """
Define the public error contract once. Delivered: closed 9-tag taxonomy (`:bad_symbol | :network | :rate_limit | :auth | :not_found | :permission | :exchange | :timeout | :unknown`), `%CcxtOcx.Error{}` struct with `:source` / `:source_name` discriminator (future-proofs Phase 7 native adapters), three-function API (`tag_for_ccxt_class/1` pure, `from_js_error/2`, `normalize/2` with `[:exchange, :method, :original, :meta]` opts for context injection), and a compile-time drift gate using `@external_resource "ccxt/js/src/base/errors.d.ts"` + exhaustive check of exported CCXT error classes.

JS path (QuickBEAM): raw `%{name: "BadSymbol", ...}` or `%QuickBEAM.JSError{}` → normalized struct with `source: :js`, `source_name: "BadSymbol"`. Wrappers call `normalize(raw, exchange: :binance, method: "createOrder")`.

Native adapters (Phase 7): will supply `source: :binance`, `source_name: venue_code`. Consumers match on `:tag`; provenance lives in the two discriminator fields.

The gate fails compilation when a new CCXT subclass appears in the .d.ts and lacks a mapping. Real QuickBEAM tests exercise actual CCXT error constructors (BadSymbol, RateLimitExceeded, AuthenticationError, ...).
"""
implemented = "As specified in body — 9-tag closed taxonomy, `%CcxtOcx.Error{}` struct with `source`/`source_name` discriminator, three-function API (`tag_for_ccxt_class/1`, `from_js_error/2`, `normalize/2`), compile-time drift gate via `@external_resource`. Live CCXT error constructors exercised in tests."

