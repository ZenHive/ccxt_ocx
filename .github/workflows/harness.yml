# Deterministic Elixir harness gate for PRs.
# Closes the Codex-env-blocked-hex.pm gap: every PR push gets format / compile /
# credo / doctor / sobelow / test+cover / dialyzer evidence as PR checks, instead
# of needing a local reviewer to fetch the branch and run the suite.
#
# ccxt_ocx-specific: `mix npm.install` runs between `deps.get` and `compile`
# because `CcxtOcx.Tiers` derives its variant inheritance at compile time from
# the loaded CCXT bundle (node_modules/ccxt/dist/ccxt.browser.min.js). Without
# the bundle, the module attribute body raises and compile fails.
#
# Customization points (search for "[CUSTOMIZE]"):
#   1. Branch trigger    — `development` is this project's default branch.
#   2. MIX_ENV            — `test`.
#   3. Coverage threshold — `80` (standard tier, young codebase). Raise to 85
#                          once coverage stabilizes. Critical-tier (signing /
#                          money / wire-format) work should layer a per-module
#                          95% ratchet as a separate job, not raise this global
#                          floor.
#   4. Integration tag    — `integration` (used by bundle/OXC tests that
#                          need the on-disk CCXT bundle; CI includes them
#                          because `mix npm.ci` provisions the bundle. The
#                          local default test run excludes them — see
#                          `test/test_helper.exs`).

name: Harness

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: Harness
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      - id: beam
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps, _build, and dialyxir PLTs
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            priv/plts
          key: mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-

      - name: Cache node_modules (CCXT bundle is a compile-time dep)
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - run: mix deps.get

      # CCXT bundle is a compile-time dep for `CcxtOcx.Tiers`. npm_ex is pure
      # Elixir (no Node.js required); `mix npm.ci` installs from the lockfile
      # for reproducible CI builds (fails if package.json drifts from lockfile).
      - name: Install npm packages (CCXT bundle)
        run: mix npm.ci

      # Task 5b — bundle surface verification gate.
      # Fails on public API drift from CCXT upgrades unless the manifest was
      # deliberately updated with human review (`mix ccxt.verify_bundle --accept`).
      - name: Verify CCXT bundle surface (Task 5b)
        run: mix ccxt.verify_bundle

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Format check
        run: mix format --check-formatted

      # tag_todo / tag_fixme stay enabled in .credo.exs (TODO/FIXME = tracked-debt
      # visibility, not regressions). Excluding them here lets the harness fail
      # only on real Credo regressions — TODO accumulation across sessions
      # shouldn't gate PRs.
      - name: Credo (strict, excluding TODO/FIXME design tags)
        run: mix credo --strict --ignore TagTODO,TagFIXME

      - name: Doctor (--raise overrides .doctor.exs raise=false to gate CI)
        run: mix doctor --raise

      - name: Sobelow (honors .sobelow-skips)
        run: mix sobelow --skip --exit Low

      # Coverage tier — 80% standard floor. ccxt_ocx is young; raise once
      # coverage stabilizes. Signing / money / wire-format code arriving in
      # later phases should add a per-module 95% ratchet as a separate job
      # rather than raising this global floor (mixed-tier codebases stuck at
      # 95% global block too often).
      # `:integration` tests need the on-disk CCXT bundle (which we install above
      # via `mix npm.ci`) but no network — include them so bundle-dependent paths
      # (BundleSurface.Compile, smoke offline bundle/OXC checks) count toward
      # the coverage gate. `test_helper.exs` excludes `:integration` and `:network`
      # by default for local fast feedback; we re-include `:integration` in CI
      # where the bundle is always present, and keep `:network` excluded.
      - name: Tests + coverage gate (>=80%)
        run: mix test.json --cover --cover-threshold 80 --summary-only --include integration --exclude network

      - name: Dialyzer
        run: mix dialyzer
