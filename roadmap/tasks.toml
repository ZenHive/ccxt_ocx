[[task]]
id = "7"
phase = 2
bundle = "macros"
milestone = "v0_1"
status = "pending"
title = "`defunified` macro"
scores = { d = 7, b = 10, u = 9 }
depends_on = ["6", "6b", "8"]
body = """
Single declaration emits the QuickBEAM call, JSON encode of args, await + decode, struct hydration, and error normalization for one unified method *across the exchanges declared in `use CcxtOcx`*. Emission is gated by Task 6b's scope — never iterate over all 100+ unconditionally. NimbleOptions schema validates the macro options at compile time (per `~/.claude/includes/development-philosophy.md` § "Cite Ecosystem Precedents"). Phoenix.Router and Ash.Resource are the precedents — single declarative line, full generated wrapper.

**Capability-gated emission:** read each exchange's `has` table at compile time (via the same throwaway runtime Task 9 boots — share the cached `priv/exchange_caps/<id>.exs` output) and *only emit* a method on that exchange's module if `ex.has[method] == true`. Result: calling `CcxtOcx.Binance.fetch_some_unsupported_method/2` raises `UndefinedFunctionError` at compile, not a runtime `{:error, :not_supported}`. Tighter contract; tradeoff is that `mix docs` per-exchange diverges and IDE completion reflects the per-venue surface (which is arguably correct, since the surface IS per-venue). Task 9's `has?/1` becomes a runtime introspection helper for user-supplied venue lists, not a routing primitive used by `defunified` itself.

[Tidewave dogfooding 2026-05-17]
- Use live CcxtOcx.Runtime + Tidewave::project_eval to drive real methods (fetchOptionChain on Deribit) before designing expansion.
- Pattern: define global async helper via eval, then call/4 (direct eval(async IIFE) frequently returns {} after suspension).
- fetchOptionChain bulk shape often lacks .strike/.optionType at top level; must parse from symbol (e.g. ETH/USD:ETH-260519-2375-P).
- IV/greeks sparse on chain response; per-symbol fetchOption richer. Test both paths via Tidewave.
- Add Tidewave-driven examples for complex returns (option chains, order books) to task acceptance.
"""
scored_at = "2026-05-16"

[[task]]
id = "8"
phase = 2
bundle = "macros"
milestone = "v0_1"
status = "pending"
title = "Typed structs for unified return shapes (with declarative field mapping)"
scores = { d = 5, b = 8, u = 8 }
depends_on = ["6"]
acceptance_criteria = [
  "Each typed struct (`Ticker`, `OrderBook`, `Candle`, `Trade`, `Market`, `Currency`) generated by introspecting the `.d.ts` types from Task 6",
  "Each field carries a declarative type tag and CCXT-shape source key via a `field name, type, from: \"ccxt_key\"` declaration",
  "Type tags are primitives — `:money_string`, `:timestamp_ms`, `:integer`, `:string`, `:list`, `:map` — not Ecto types",
  "Money fields land as Decimal-compatible strings (no float anywhere); `:timestamp_ms` lands as ms-since-epoch integer (intent documented, not converted)",
  "Auto-generated `from_ccxt/1` round-trips a CCXT-shaped map to the struct without per-method hand-written parser code",
  "NimbleOptions schema validates field declarations at compile time; unknown type tags fail compile, not runtime",
  "Doctests cover the happy path; ExUnit covers missing-field, extra-field, empty-array, and type-mismatch cases",
  "Task 7's `defunified` consumes `from_ccxt/1` for struct hydration — no per-method parser code in `defunified`'s expansion",
]
out_of_scope = [
  "Native-adapter (N0) parser shape — stays in N0's per-exchange extracted manifest, emitting the struct directly from raw-venue JSON without routing through `from_ccxt/1`",
  "Decimal arithmetic — `:money_string` is just a type tag, no Decimal lib pulled in by Task 8",
  "Bidirectional codec — only `from_ccxt/1` is emitted; outbound order placement uses `defendpoint`'s param surface, not struct serialization",
]
body = """
`CcxtOcx.Ticker`, `OrderBook`, `Candle`, `Trade`, `Market`, `Currency` — each generated by introspecting the `.d.ts` types from Task 6. TypedStruct underneath if its macro hooks accommodate the `from:` extension; otherwise hand-roll the struct macro to keep the field-declaration surface clean.

**Declarative field mapping is part of the struct definition, not a separate parser layer:**

    field :timestamp, :timestamp_ms, from: "timestamp"
    field :last,      :money_string, from: "last"
    field :bid,       :money_string, from: "bid"
    field :symbol,    :string,       from: "symbol"

The macro expands to the struct definition + a generated `from_ccxt/1` that walks the CCXT-shaped map and produces the canonical Elixir struct. Type tags are primitives; money stays string per the no-float rule.

**Why declarative mapping belongs here, not in `defunified` or N0:** ~6 typed structs × N venues × 2 adapter paths (JS via Task 7's struct hydration, native via Phase 7 N0's parser fns) is exactly the recurrence the macro layer exists to flatten. Hand-coding the field mapping in each adapter's parser duplicates the same shape twice; bundle bumps that rename a CCXT key silently break two parsers instead of failing one declaration. Centralizing on the struct gives Task 7 a zero-parser-code expansion (`Ticker.from_ccxt(map)`) and gives N3's conformance harness a canonical declaration to diff venue parsers against.

**Scope locked to CCXT-shape only.** `from:` declares the CCXT-shape key — *not* the raw-venue key. Native adapters (Phase 7 / N0) own their own per-venue parser layer that emits the canonical struct directly from raw-venue JSON; they do NOT route through Task 8's `from_ccxt/1`. This keeps venue-specific knowledge out of the struct definition and inside N0's per-exchange extracted manifest. The two adapter paths converge on the *struct*, not on a shared parser pipeline.

**NimbleOptions on the field declaration.** Per `~/.claude/includes/development-philosophy.md` § "Cite Ecosystem Precedents Before Crying Complexity": Ecto.Schema's `field/3`, Ash.Resource attributes, LiveView's `attr/3`, and TypedStruct all establish the precedent — single declaration → struct + types + validation + codegen. NimbleOptions schema validates the option keyword at compile time; unknown type tags fail compile rather than at first parse.

[Tidewave dogfooding 2026-05-17]
- Use Tidewave + live runtime to inspect real CCXT return shapes (fetchOptionChain, fetchOption) before declaring fields.
- Observed: strike/expiry often absent or under .info on bulk; symbol string authoritative for options. from_ccxt must handle sparse fields + venue keys.
- Add Tidewave repro steps for each struct in acceptance criteria.
"""
scored_at = "2026-05-16"

