status = "pending"
title = "`CcxtOcx.RuntimePool` supervisor"
scores = { d = 5, b = 8, u = 7 }
scored_at = "2026-05-16"
body = """
Build the supervised runtime pooling layer from observed QuickBEAM behavior, not assumption. Tidewave confirmed `QuickBEAM.Pool.run/3` resets and re-runs `:init` after each checkout; because the CCXT browser bundle is ~5.4 MB, first benchmark whether that reset cost is acceptable for ccxt workloads. If it is acceptable, wrap `QuickBEAM.Pool` behind `CcxtOcx.RuntimePool`. If it is not, implement a long-lived pool of `CcxtOcx.Runtime` workers that keeps CCXT loaded across calls. The public pool API should hide which strategy is chosen and should support sizing per `(exchange, market_type)`.
"""
acceptance_criteria = [
  "Benchmark or integration test demonstrates whether a checkout re-evaluates the CCXT bundle for the chosen strategy",
  "Pool is supervised under the application and can execute concurrent CCXT eval/call work",
  "Each checked-out runtime has CCXT loaded and reports the same bundle version/exchange count as `CcxtOcx.Runtime.info/1`",
  "Tests cover worker crash/restart behavior and concurrent checkout behavior"
]

[[task]]
id = "4"
phase = 1
bundle = "foundation"
status = "pending"
title = "`CcxtOcx.Error` — canonical error taxonomy + JS adapter mapping"
scores = { d = 4, b = 7, u = 6 }
scored_at = "2026-05-16"
body = """
Define the public error contract once, owned by the wrapper, not by any adapter. `CcxtOcx.Error` enumerates the canonical tags (`:bad_symbol`, `:network`, `:rate_limit`, `:auth`, `:insufficient_funds`, `:invalid_order`, `:order_not_found`, `:exchange_not_available`, `:unknown`); every wrapper returns `{:error, tag, %CcxtOcx.Error{...}}` regardless of which adapter handled the call. **JS adapter responsibility:** map CCXT's error class names (`%QuickBEAM.JS.Error{name: "BadSymbol" | "NetworkError" | "RateLimitExceeded" | ...}`) to canonical tags — small stable table, since CCXT's maintainers own the venue-code → CCXT-class mapping upstream. **Native adapters (Phase 7) responsibility:** carry their own full venue-code → canonical-tag tables; no upstream maintainer doing it for them. Task 5b's bundle-bump pipeline catches new CCXT error classes we haven't mapped (assertion: zero `:unknown` tags in the smoke suite). Task N3's conformance harness catches when CCXT-class drift means the native adapter's venue-code table is stale (see N3). The taxonomy itself is the contract — adapters translate into it; consumers never see adapter-specific shapes.

**Macro-generated JS mapping (refinement):** the CCXT-class → canonical-tag table for the JS adapter can be macro-generated rather than hand-curated. At compile time, walk CCXT's error-class hierarchy — either via OXC parse of `node_modules/ccxt/js/src/base/errors.js`, or via runtime introspection during the same compile-time bundle boot Task 9 already performs — and emit the case statement. Bundle bumps that add a new error class fail compile with "unmapped: NewErrorName", catching drift mechanically rather than via the smoke-suite zero-`:unknown` assertion. Cross-reference Task 5b: the error-class diff joins the unified-method-list and per-exchange `has`-table diff already there.
"""

