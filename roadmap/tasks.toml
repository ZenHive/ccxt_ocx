[focus]
phase = 1

# ── Phases ────────────────────────────────────────────────────────────────

[phases.1]
name = "Foundation — Runtime Lifecycle"
order = 1
status = "done"

[phases.2]
name = "Macro-Driven Method Generation"
order = 2
status = "pending"

[phases.3]
name = "Streaming (CCXT Pro)"
order = 3
status = "pending"

[phases.4]
name = "Trade-Plane Verification"
order = 4
status = "pending"

[phases.5]
name = "Production Hardening"
order = 5
status = "pending"

[phases.6]
name = "DX and Docs"
order = 6
status = "pending"

[phases.7]
name = "Native-Elixir Migration"
order = 7
status = "pending"

# ── Bundles ───────────────────────────────────────────────────────────────
# One bundle per phase — sub-divide later via `rmap mark` if shape calls for it.

[bundles.foundation]
phase = 1
order = 1
description = "Runtime lifecycle, supervision, smoke tests, bundle-bump verification"

[bundles.macros]
phase = 2
order = 1
description = "Compile-time generation of unified methods + per-exchange modules from CCXT's .d.ts"

[bundles.streaming]
phase = 3
order = 1
description = "WS surface — defstreaming macro, GenStage producer, reconnect/heartbeat policy"

[bundles.trade-verify]
phase = 4
order = 1
description = "Testnet harnesses + signed-payload byte-comparison for the trade plane"

[bundles.production]
phase = 5
order = 1
description = "Telemetry, memory monitoring, ApiToolkit integration, rate-limit / nonce hoisting, sandboxed deployment"

[bundles.dx]
phase = 6
order = 1
description = "ex_doc / llms.txt, Descripex annotations, Tidewave examples"

[bundles.native]
phase = 7
order = 1
description = "Native-Elixir adapters for Tier-1 venues — defendpoint macro, behaviours, routing, conformance harness, per-venue ports"

# ── Milestones — release lines (cross-phase) ──────────────────────────────

[milestones.v0_1]
name = "v0.1 — first usable (data plane)"
description = "Macro-generated read-only data plane on Tier-1 venues end-to-end. Library is callable from IEx for fetchTicker/fetchOrderBook/fetchOHLCV via typed wrappers."
target_version = "0.1.0"
order = 1
status = "active"

[milestones.v1_0]
name = "v1.0 — production-ready trade plane (orders + WS auth streams)"
description = "Full unified CCXT surface incl. signed trade plane verified against Binance USDT-M futures + Deribit options testnets, with auth WS streams (watchBalance/watchOrders/watchMyTrades), reconnect/heartbeat policy, rate-limit + nonce hoisted into Elixir, and memory/restart safety. OKX explicitly out of scope for v1.0."
target_version = "1.0.0"
order = 2
status = "pending"

